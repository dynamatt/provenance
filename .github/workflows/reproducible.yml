name: Reproducible build

# Proves the build recipe is reproducible (DES-0024): every release
# platform is built on two different runners, from different checkout paths,
# and the binaries must be byte-identical.

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: reproducible-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            path: a/provenance
          - runner: ubuntu-24.04-arm
            path: some/much/deeper/checkout/path/src
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: ${{ matrix.path }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.path }}/go.mod
          cache-dependency-path: ${{ matrix.path }}/go.sum

      - name: Build release platforms
        working-directory: ${{ matrix.path }}
        run: make dist

      # make dist writes the release manifest; the runners' manifests must
      # match line for line.
      - name: Hash binaries
        working-directory: ${{ matrix.path }}/dist
        run: |
          sha256sum -c SHA256SUMS
          tee "$RUNNER_TEMP/hashes-${{ matrix.runner }}.txt" < SHA256SUMS

      - name: Upload hashes
        uses: actions/upload-artifact@v7
        with:
          name: hashes-${{ matrix.runner }}
          path: ${{ runner.temp }}/hashes-${{ matrix.runner }}.txt
          if-no-files-found: error

  compare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download hashes
        uses: actions/download-artifact@v8
        with:
          pattern: hashes-*
          path: hashes
          merge-multiple: true

      - name: Compare
        run: |
          files=(hashes/*.txt)
          if [ "${#files[@]}" -ne 2 ]; then
            echo "expected hashes from 2 runners, got ${#files[@]}"
            exit 1
          fi
          a=${files[0]} b=${files[1]}
          la=$(basename "$a" .txt); la=${la#hashes-}
          lb=$(basename "$b" .txt); lb=${lb#hashes-}

          status=0
          {
            echo "### Reproducible build"
            echo
            echo "Built on \`$la\` and \`$lb\` from different checkout paths."
            echo
            echo "| Binary | $la | $lb | |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r ha file; do
            hb=$(awk -v f="$file" '$2 == f { print $1 }' "$b")
            if [ "$ha" = "$hb" ]; then
              result="match"
            else
              result="**DIFFERENT**"
              status=1
            fi
            echo "| \`$file\` | \`$ha\` | \`${hb:-missing}\` | $result |" >> "$GITHUB_STEP_SUMMARY"
          done < "$a"
          if [ "$(awk '{ print $2 }' "$a" | sort)" != "$(awk '{ print $2 }' "$b" | sort)" ]; then
            echo "The runners built different sets of binaries." | tee -a "$GITHUB_STEP_SUMMARY"
            status=1
          fi

          diff "$a" "$b" || true
          if [ "$status" -ne 0 ]; then
            echo "Builds are not reproducible: hashes differ between runners."
          else
            echo "All binaries are byte-identical across runners."
          fi
          exit "$status"
