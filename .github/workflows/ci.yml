name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # go.mod's toolchain directive pins the exact Go release.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: Build
        run: make build

      - name: Check out example repository
        run: make example

      - name: Acceptance tests
        run: make acceptance

      - name: Record binary hash
        run: |
          {
            echo "### bin/provenance (linux/amd64)"
            echo
            echo '```'
            ./bin/provenance version
            echo
            sha256sum bin/provenance
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: provenance-linux-amd64
          path: bin/provenance
          if-no-files-found: error

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
